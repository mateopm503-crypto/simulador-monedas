:root {
  --bg: #00349A;        /* azul pizarra */
  --line: #FFFFFF;
  --title: #FFE600;
  --lcd-bg: #1F1F1F;
  --lcd: #C6FF00;
  --bar: #C3CFE8;
  --bar-edge: #FFFFFF;
  --est: #FF5A36;
  --btn: #FFFFFF;
  --btn-ink: #0B1D4D;
  --coin: #C9852A;
  --coin-edge: #F5A01A;
  --coin-ink: #9A3300;
  --f: 'RHD', 'Segoe UI', Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { font-family: var(--f); font-weight: 700; color: var(--line); overflow: hidden;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
button, label, input { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.app { height: 100%; display: grid; grid-template-columns: minmax(330px, 40%) 1fr; }

/* ---------- panel izquierdo ---------- */
.left { position: relative; padding: 2.2vh 2vw 3vh; display: flex; flex-direction: column; gap: 1.8vh; overflow-y: auto; border-right: 4px solid var(--line); min-width: 0; }
h1 { margin: 0; color: var(--title); font-size: clamp(24px, min(3.2vw, 6vh), 52px); font-weight: 900; letter-spacing: -.02em; line-height: 1; text-transform: uppercase; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.left { container-type: inline-size; }
#launch { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2cqi; }
#launch .btn { white-space: nowrap; overflow: hidden; padding: .55em .15em; font-size: clamp(13px, 3.5cqi, 30px); }
@container (max-width: 380px) {
  #launch { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #launch .btn { font-size: clamp(14px, 6.5cqi, 26px); }
}
.btn { font: inherit; font-weight: 800; font-size: clamp(18px, 1.7vw, 28px); background: var(--btn); color: var(--btn-ink); border: 0; border-radius: 6px; padding: .45em .8em; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.btn.big { background: var(--title); }
.btn.stop { background: #FF8A8A; }
.btn.ghost { background: transparent; color: var(--line); border: 3px solid var(--line); box-shadow: none; font-size: clamp(14px, 1.2vw, 20px); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn:focus-visible, input:focus-visible + .knob { outline: 4px solid var(--title); outline-offset: 3px; }
.speed { display: flex; align-items: center; gap: 8px; font-size: clamp(13px, 1.1vw, 18px); }
.speed { flex-wrap: wrap; }
.speed button { font: inherit; background: transparent; color: var(--line); border: 2px solid var(--line); border-radius: 22px; padding: 6px 14px; min-height: 40px; cursor: pointer; }
.speed button[aria-pressed="true"] { background: var(--line); color: var(--btn-ink); }

.lcd { background: var(--lcd-bg); color: var(--lcd); padding: 1.4vh 1.4vw; font-size: clamp(28px, min(4.4vw, 7.5vh), 78px); line-height: 1.12; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.lcd div { display: flex; justify-content: space-between; gap: 18px; }
.lcd small { display: block; font-size: .42em; color: #8FB300; text-align: right; margin-top: .2em; }

.bottom { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.coin-wrap { display: flex; align-items: center; gap: 14px; }
.coin { width: clamp(100px, min(15vw, 25vh), 270px); aspect-ratio: 1; flex: none; filter: drop-shadow(0 6px 0 rgba(0,0,0,.3)); }
.coin img { width: 100%; height: 100%; display: block; border-radius: 50%; }
.coin-lbl { font-size: clamp(22px, min(2.4vw, 4.4vh), 44px); color: var(--title); letter-spacing: .02em; }
#ctrl { display: grid; grid-template-columns: 1fr 1fr; gap: 2cqi; }
#ctrl .btn { font-size: clamp(14px, 3.4cqi, 28px); padding: .5em .3em; white-space: nowrap; }
#stop { background: #FF6B6B; color: #fff; visibility: hidden; }
#stop.show { visibility: visible; }
.coin.flip { animation: flip .2s ease-in-out; }
@keyframes flip { 50% { transform: scaleX(.08); } }

.toggle { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: clamp(13px, 1.1vw, 18px); cursor: pointer; user-select: none; }
.toggle input { position: absolute; opacity: 0; }
.knob { width: 58px; height: 26px; border-radius: 13px; background: #6E8BD6; position: relative; }
.knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--line); border: 2px solid var(--btn-ink); transition: left .15s; }
.toggle input:checked + .knob::after { left: 35px; }
.toggle .names { display: flex; gap: 12px; }
.toggle .on { color: var(--title); }

/* ---------- gráfico ---------- */
.chart { position: relative; display: flex; flex-direction: column; padding: 3vh 2.5vw 2vh 0; min-width: 0; }
.plot { position: relative; flex: 1; margin-left: 74px; border-bottom: 4px solid var(--line); border-left: 4px solid var(--line); }
.plot::before { content: ""; position: absolute; left: -12px; top: -14px; border: 10px solid transparent; border-bottom: 14px solid var(--line); border-top: 0; }
.tick { position: absolute; left: -74px; width: 74px; font-size: clamp(14px, 1.2vw, 20px); line-height: 1; text-align: right; padding-right: 14px; transform: translateY(50%); font-variant-numeric: tabular-nums; }
.tick::after { content: ""; position: absolute; right: -4px; top: 50%; width: 10px; border-top: 3px solid var(--line); }
.grid { position: absolute; left: 0; right: 0; border-top: 1px solid rgba(255,255,255,.14); }
.bars { position: absolute; inset: 0; display: flex; justify-content: space-evenly; align-items: flex-end; }
.bar { width: 24%; max-width: 220px; height: 0; background: var(--bar); border: 3px solid var(--bar-edge); border-bottom: 0; position: relative; transition: height .16s linear; }
.val { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 8px; font-size: clamp(22px, 2.4vw, 40px); white-space: nowrap; font-variant-numeric: tabular-nums; }
.val small { font-size: .62em; color: var(--title); }
.est { position: absolute; left: 0; right: 0; border-top: 5px dashed var(--est); transition: bottom .16s linear; z-index: 2; }
.est span { position: absolute; right: 6px; top: -34px; color: var(--est); font-size: clamp(14px, 1.3vw, 22px); background: var(--bg); padding: 0 6px; }
.labels { display: flex; justify-content: space-evenly; margin-left: 74px; padding-top: 10px; font-size: clamp(26px, 2.8vw, 46px); }
.labels div { width: 24%; max-width: 220px; text-align: center; }
.check { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 1.4vh 0 0 74px; font-size: clamp(15px, 1.3vw, 22px); cursor: pointer; user-select: none; }
.check input { width: 30px; height: 30px; accent-color: var(--est); cursor: pointer; }
/* ---------- tablets en vertical y celulares ---------- */
@media (max-width: 900px) and (orientation: portrait), (max-width: 640px) {
  body { overflow-y: auto; height: auto; min-height: 100%; }
  .app { grid-template-columns: 1fr; height: auto; min-height: 100%; }
  .left { border-right: 0; border-bottom: 4px solid var(--line); padding: 18px 16px; gap: 14px; overflow: visible; }
  h1 { font-size: clamp(26px, 7vw, 52px); }
  .btn { font-size: clamp(16px, 3.6vw, 28px); padding: .6em .4em; min-height: 52px; }
  .btn.ghost { font-size: clamp(15px, 3vw, 20px); min-height: 44px; }
  .speed { font-size: clamp(15px, 3vw, 20px); }
  .lcd { font-size: clamp(30px, 9vw, 72px); padding: 12px 16px; }
  .coin { width: clamp(120px, 34vw, 240px); }
  .coin-lbl { font-size: clamp(22px, 6vw, 40px); }
  .toggle { font-size: clamp(14px, 3vw, 20px); }
  .knob { width: 70px; height: 32px; border-radius: 16px; }
  .knob::after { width: 26px; height: 26px; }
  .toggle input:checked + .knob::after { left: 41px; }
  .chart { height: max(380px, 62vh); padding: 34px 16px 14px 0; }
  .plot, .labels { margin-left: 58px; }
  .check { margin-left: 58px; font-size: clamp(16px, 3.4vw, 22px); }
  .tick { left: -58px; width: 58px; padding-right: 12px; font-size: clamp(13px, 2.6vw, 18px); }
  .labels { font-size: clamp(24px, 6vw, 42px); }
  .val { font-size: clamp(20px, 5vw, 36px); }
  .est span { font-size: clamp(13px, 2.8vw, 20px); }
}
/* ---------- celulares acostados (pantalla baja) ---------- */
@media (max-height: 520px) and (orientation: landscape) {
  .left { padding: 10px 14px; gap: 8px; }
  h1 { font-size: clamp(18px, 5.5vh, 30px); }
  .btn { font-size: 15px; padding: .45em .6em; }
  .btn.ghost { font-size: 13px; padding: .35em .6em; }
  .speed { font-size: 13px; } .speed button { min-height: 32px; padding: 3px 10px; }
  .lcd { font-size: clamp(20px, 8vh, 40px); padding: 6px 12px; }
  .coin { width: 19vh; }
  .coin-lbl { font-size: 5vh; }
  #ctrl .btn { font-size: 14px; padding: .35em .3em; }
  .left { gap: 6px; }
  .lcd { font-size: clamp(18px, 7vh, 36px); }
  .chart { padding: 18px 12px 8px 0; }
  .labels { font-size: clamp(18px, 6vh, 30px); padding-top: 4px; }
  .check { margin-top: 4px; font-size: 14px; } .check input { width: 24px; height: 24px; }
  .val { font-size: clamp(16px, 5.5vh, 28px); }
  #launch .btn { font-size: 14px; padding: .32em .15em; }
  .lcd { font-size: clamp(16px, 6vh, 30px); padding: 4px 10px; }
  h1 { font-size: clamp(16px, 5vh, 26px); }
}
@media (prefers-reduced-motion: reduce) { .bar, .est { transition: none; } .coin.flip { animation: none; } }
</style>

<body>
<div class="app">
  <section class="left" aria-label="Controles">
    <h1>Lanzamiento de una moneda</h1>
    <div class="row" id="launch">
      <button class="btn" data-n="1">1 vez</button>
      <button class="btn" data-n="10">10 veces</button>
      <button class="btn" data-n="100">100 veces</button>
      <button class="btn big" data-n="1000">1.000 veces</button>
    </div>
    <div id="ctrl">
      <button class="btn ghost" id="reset">Reiniciar</button>
      <button class="btn" id="stop">Detener</button>
    </div>
    <div class="speed" id="speed">Velocidad:
      <button data-s="1.8" aria-pressed="false">Lenta</button>
      <button data-s="1" aria-pressed="true">Normal</button>
      <button data-s="0.4" aria-pressed="false">Rápida</button>
    </div>
    <div class="lcd" aria-live="polite">
      <div><span>Nº caras:</span><span id="nC">0</span></div>
      <div><span>Nº sellos:</span><span id="nS">0</span></div>
      <small>Total: <span id="nT">0</span> lanzamientos</small>
    </div>
    <div class="bottom">
      <div class="coin-wrap">
        <div class="coin" id="coin" aria-hidden="true"></div>
        <div class="coin-lbl" id="coinLbl" aria-live="polite">CARA</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="mode" aria-label="Ver frecuencia relativa">
        <span class="knob"></span>
        <span class="names"><span id="lAbs" class="on">ABSOLUTA</span><span id="lRel">RELATIVA</span></span>
      </label>
    </div>
  </section>

  <section class="chart" aria-label="Gráfico de barras">
    <div class="plot" id="plot">
      <div id="ticks"></div>
      <div class="est" id="est"><span>la mitad</span></div>
      <div class="bars">
        <div class="bar" id="barC"><div class="val" id="vC">0</div></div>
        <div class="bar" id="barS"><div class="val" id="vS">0</div></div>
      </div>
    </div>
    <div class="labels"><div>CARA</div><div>SELLO</div></div>
    <label class="check"><input type="checkbox" id="showEst" checked> Ver estimación</label>
  </section>
</div>

  const dec = v => (Math.round(v * 100) / 100).toLocaleString('es-CL', { minimumFractionDigits: 2 });
  // segundos por tanda a velocidad normal: se ve subir, ni muy rápido ni muy lento
  const DUR = { 1: 0.25, 10: 3, 100: 8, 1000: 16 };
  let caras = 0, sellos = 0, speed = 1, relative = false, running = false, raf = 0, axisMax = 0;

  const bit = () => { const a = new Uint8Array(1); crypto.getRandomValues(a); return (a[0] & 1) === 1; };
  function niceMax(v) {
    const s = [10, 20, 30, 40, 50, 60, 80, 100, 150, 200, 300, 400, 500, 600, 800, 1000, 1500, 2000, 3000, 5000, 10000, 20000, 50000];
    return s.find(x => x >= v) || Math.ceil(v / 50000) * 50000;
  }
  function drawTicks() {
    const t = $('ticks'); t.innerHTML = '';
    const steps = relative ? 4 : 5;
    for (let i = 0; i <= steps; i++) {
      const p = 100 * i / steps;
      const label = relative ? dec(i / steps) : fmt(Math.round(axisMax * i / steps));
      t.insertAdjacentHTML('beforeend', `<div class="tick" style="bottom:${p}%">${label}</div>`
        + (i ? `<div class="grid" style="bottom:${p}%"></div>` : ''));
    }
  }
  function render() {
    const n = caras + sellos;
    if (!relative) {
      const need = niceMax(Math.max(10, caras * 1.15, sellos * 1.15));
      if (need !== axisMax) { axisMax = need; drawTicks(); }
    }
    const hC = relative ? (n ? 100 * caras / n : 0) : 100 * caras / axisMax;

    $('barC').style.height = hC + '%';

    const pc = v => n ? ` <small>(${Math.round(100 * v / n)}%)</small>` : '';
    $('vC').innerHTML = (relative ? (n ? dec(caras / n) : '–') : fmt(caras)) + pc(caras);
    $('vS').innerHTML = (relative ? (n ? dec(sellos / n) : '–') : fmt(sellos)) + pc(sellos);
    $('est').style.bottom = (relative ? 50 : 100 * (n / 2) / axisMax) + '%';
    $('nC').textContent = fmt(caras); $('nS').textContent = fmt(sellos); $('nT').textContent = fmt(n);

  const COIN = { true: `<img src="${IMG_CARA}" alt="Cara de una moneda chilena">`, false: `<img src="${IMG_SELLO}" alt="Sello de una moneda chilena">` };
  function showCoin(c) {
    const coin = $('coin');
    coin.innerHTML = COIN[c];
    $('coinLbl').textContent = c ? 'CARA' : 'SELLO';
    coin.classList.remove('flip'); void coin.offsetWidth; coin.classList.add('flip');
  }
  function setRunning(r) {
    running = r;
    document.querySelectorAll('#launch .btn').forEach(b => b.disabled = r);
    $('stop').classList.toggle('show', r);
  }
  function launch(total) {
    if (running) return;
    // cada tanda parte de cero: 1.000 veces muestra exactamente 1.000 lanzamientos
    caras = 0; sellos = 0; axisMax = 0; render();
    const dur = (DUR[total] || 8) * speed * 1000;
    let done = 0; const t0 = performance.now();
    setRunning(true);
    function step(t) {
      const k = Math.min(1, (t - t0) / dur);
      const target = Math.max(1, Math.round(total * (k * k * 0.35 + k * 0.65)));
      let last = null;
      while (done < target) { last = bit(); last ? caras++ : sellos++; done++; }
      if (last !== null) { showCoin(last); render(); }
      if (done < total) raf = requestAnimationFrame(step); else setRunning(false);
    }
    raf = requestAnimationFrame(step);
  }
  document.querySelectorAll('#launch .btn').forEach(b => b.addEventListener('click', () => launch(+b.dataset.n)));
  $('stop').addEventListener('click', () => { if (running) { cancelAnimationFrame(raf); setRunning(false); } });
  $('speed').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $('speed').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    speed = +b.dataset.s;
  });
  $('mode').addEventListener('change', e => {
    relative = e.target.checked;
    $('lAbs').classList.toggle('on', !relative); $('lRel').classList.toggle('on', relative);
    $('est').querySelector('span').textContent = relative ? '0,50 (la mitad)' : 'la mitad';
    axisMax = 0; drawTicks(); render();
  });
  $('showEst').addEventListener('change', e => $('est').hidden = !e.target.checked);
  $('reset').addEventListener('click', () => {
    if (running) { cancelAnimationFrame(raf); setRunning(false); }
    caras = 0; sellos = 0; axisMax = 0;
    $('coin').innerHTML = COIN[true]; $('coinLbl').textContent = 'CARA';
    render();
  });
  $('coin').innerHTML = COIN[true];
  render();
